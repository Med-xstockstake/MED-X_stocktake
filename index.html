<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFD100">
<link rel="manifest" href="./manifest.json">
<title>Med-X Stocktake</title>
<style>
:root{--blk:#111;--yel:#FFD100;--yel-lt:#FFF8CC;--yel-dk:#C9A800;--bg:#f5f5f3;--white:#fff;--gray:#888;--bdr:#e0dfd8;--red:#A32D2D;--red-lt:#FAECE7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--blk);min-height:100vh}
.setup{max-width:480px;margin:0 auto;padding:0}
.setup-hdr{background:var(--blk);padding:32px 24px 24px;text-align:center}
.setup-logo{color:var(--yel);font-size:26px;font-weight:700;letter-spacing:-.5px}
.setup-sub{color:#aaa;font-size:13px;margin-top:4px}
.setup-body{padding:20px}
.flbl{font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--gray);margin:14px 0 6px}
.finp{width:100%;padding:12px 14px;font-size:15px;border:1.5px solid var(--bdr);border-radius:9px;background:var(--white);color:var(--blk);font-family:inherit}
.finp:focus{outline:none;border-color:var(--blk)}
.date-row{display:flex;gap:10px}.date-row .finp{flex:1}
.btn-find{width:100%;padding:16px;font-size:17px;font-weight:700;border:none;border-radius:11px;background:var(--yel);color:var(--blk);cursor:pointer;font-family:inherit}
.btn-find:hover{background:var(--yel-dk)}
.btn-primary{width:100%;padding:14px;font-size:15px;font-weight:600;border:none;border-radius:11px;background:var(--blk);color:var(--yel);cursor:pointer;margin-top:16px;font-family:inherit}
.btn-primary:disabled{opacity:.35;cursor:default}
.btn-primary:not(:disabled):hover{background:#333}
.btn-secondary{width:100%;padding:12px;font-size:14px;font-weight:500;border:1.5px solid var(--bdr);border-radius:10px;background:var(--white);color:var(--blk);cursor:pointer;margin-top:10px;font-family:inherit}
.btn-secondary:hover{background:var(--bg)}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0 0}
.divider-line{flex:1;height:1px;background:var(--bdr)}
.divider-txt{font-size:12px;color:#bbb}
/* sync status */
.sync-bar{display:flex;align-items:center;gap:6px;padding:8px 16px;font-size:12px;background:#1e1e1c}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#444;flex-shrink:0}
.sync-dot.ok{background:#4CAF50}
.sync-dot.err{background:#D85A30}
.sync-dot.syncing{background:var(--yel);animation:pulse .8s infinite}
.sync-txt{color:#888}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* App header */
.app-hdr{background:var(--blk);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.app-hdr-left .app-title{font-size:15px;font-weight:600;color:var(--yel)}
.app-hdr-left .app-sub{font-size:11px;color:#888;margin-top:1px}
.app-hdr-right{display:flex;gap:8px;align-items:center}
.hdr-btn{background:none;border:1px solid #333;border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer;font-family:inherit;color:#ccc;display:flex;align-items:center;gap:5px}
.hdr-btn:hover{border-color:#555;color:var(--white)}
.hdr-badge{background:var(--yel);color:var(--blk);border-radius:10px;padding:1px 7px;font-size:11px;font-weight:600}
/* Location bar */
.loc-bar{background:#1e1e1c;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #333}
.loc-display{display:flex;align-items:center;gap:8px}
.loc-dot{width:9px;height:9px;border-radius:50%;background:#444}
.loc-dot.active{background:var(--yel)}
.loc-text{font-size:14px;font-weight:500;color:var(--white)}
.loc-text.none{color:#555}
.scan-btn{background:var(--yel);color:var(--blk);border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.scan-btn:hover{background:var(--yel-dk)}
/* Count card */
.count-wrap{max-width:480px;margin:0 auto;padding:16px}
.count-card{background:var(--white);border-radius:14px;border:1.5px solid var(--bdr);padding:20px 18px;transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .28s ease}
.count-card.slide-out{transform:translateY(-55px) scale(.96);opacity:0;pointer-events:none}
@keyframes slideIn{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
.count-card.slide-in{animation:slideIn .22s ease}
.item-sel{width:100%;padding:12px 14px;font-size:15px;border:1.5px solid var(--bdr);border-radius:10px;background:var(--bg);color:var(--blk);font-family:inherit;cursor:pointer;margin-bottom:12px}
.item-sel:focus{outline:none;border-color:var(--blk)}
.custom-inp{width:100%;padding:10px 14px;font-size:14px;border:1.5px solid var(--bdr);border-radius:8px;background:var(--bg);font-family:inherit;margin-bottom:12px;color:var(--blk)}
.custom-inp:focus{outline:none;border-color:var(--blk)}
/* Quick rows */
.quick-section{margin-bottom:16px;display:flex;flex-direction:column;gap:8px}
.quick-row{display:flex;align-items:center;gap:10px;background:var(--white);border:1.5px solid var(--bdr);border-radius:10px;padding:10px 12px}
.quick-row.box-row:not(.disabled){border-color:var(--blk)}
.quick-row.pal-row:not(.disabled){border-color:var(--yel-dk)}
.quick-row.disabled{opacity:.32}
.qrow-info{flex:1;min-width:0}
.qrow-label{font-size:13px;font-weight:600;color:#bbb}
.quick-row.box-row:not(.disabled) .qrow-label{color:var(--blk)}
.quick-row.pal-row:not(.disabled) .qrow-label{color:var(--yel-dk)}
.qrow-sub{font-size:11px;color:var(--gray);margin-top:1px}
.qrow-tally{font-size:13px;font-weight:500;margin-top:4px;color:#bbb}
.quick-row.box-row:not(.disabled) .qrow-tally{color:var(--blk)}
.quick-row.pal-row:not(.disabled) .qrow-tally{color:var(--yel-dk)}
.qpm-pair{display:flex;gap:6px;flex-shrink:0}
.qpm{width:46px;height:46px;border-radius:9px;border:1.5px solid var(--bdr);background:var(--bg);font-size:20px;cursor:pointer;font-family:inherit;color:var(--blk)}
.qpm:hover:not(:disabled){background:#e0dfd8}
.qpm:disabled{opacity:.3;cursor:default}
/* Count row */
.count-row{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.count-lbl{font-size:13px;color:var(--gray);min-width:72px}
.count-ctrl{display:flex;align-items:center;border:1.5px solid var(--bdr);border-radius:10px;overflow:hidden}
.cpm{width:46px;height:46px;border:none;background:var(--bg);font-size:22px;cursor:pointer;font-family:inherit;color:var(--blk)}
.cpm:hover{background:#e0dfd8}
.cnum{width:76px;height:46px;border:none;border-left:1px solid var(--bdr);border-right:1px solid var(--bdr);text-align:center;font-size:18px;font-weight:500;background:var(--white);font-family:inherit;color:var(--blk)}
.cnum:focus{outline:none}
.clr-btn{background:none;border:none;color:#bbb;font-size:12px;cursor:pointer;font-family:inherit;margin-left:auto;padding:4px}
.clr-btn:hover{color:var(--red)}
.confirm-btn{width:100%;padding:15px;font-size:16px;font-weight:600;border:none;border-radius:11px;background:var(--yel);color:var(--blk);cursor:pointer;font-family:inherit}
.confirm-btn:hover{background:var(--yel-dk)}
.confirm-btn:disabled{opacity:.35;cursor:default}
/* History panel */
.hist-overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end}
.hist-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.hist-panel{position:relative;background:var(--white);border-radius:18px 18px 0 0;max-height:88vh;display:flex;flex-direction:column;animation:slideUp .24s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.hist-hdr{display:flex;align-items:flex-start;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--bdr);flex-shrink:0;background:var(--blk);border-radius:18px 18px 0 0}
.hist-hdr-title{font-size:16px;font-weight:600;color:var(--yel)}
.hist-hdr-sub{font-size:12px;color:#888;margin-top:2px}
.hist-close{background:none;border:none;font-size:24px;color:#666;cursor:pointer;line-height:1;padding:0 2px}
.hist-close:hover{color:var(--white)}
.hist-list{overflow-y:auto;flex:1}
.hist-row{display:flex;align-items:center;padding:11px 18px;gap:10px;border-bottom:1px solid #f5f5f3}
.hist-row:last-child{border-bottom:none}
.hist-row-info{flex:1;min-width:0}
.hist-row-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-row-meta{font-size:11px;color:var(--gray);margin-top:2px;display:flex;gap:8px;align-items:center}
.hist-loc-tag{background:var(--yel-lt);color:#7a6000;padding:1px 6px;border-radius:5px;font-size:11px;font-weight:500}
.hist-sync-tag{font-size:10px;color:#4CAF50}
.hist-row-count{font-size:18px;font-weight:600;min-width:52px;text-align:right}
.hist-edit{background:none;border:1px solid var(--bdr);border-radius:6px;color:var(--gray);font-size:12px;cursor:pointer;padding:4px 8px;font-family:inherit}
.hist-edit:hover{border-color:var(--blk);color:var(--blk)}
.hist-del{background:none;border:none;color:#ddd;font-size:20px;cursor:pointer;padding:2px 6px;line-height:1}
.hist-del:hover{color:var(--red)}
.hist-empty{text-align:center;padding:48px 20px;color:#bbb;font-size:14px}
.hist-footer{padding:12px 16px;border-top:1px solid var(--bdr);display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.hfbtn{flex:1;min-width:80px;padding:11px 8px;font-size:13px;font-weight:600;border-radius:10px;cursor:pointer;font-family:inherit;text-align:center}
.hfbtn.pdf{background:var(--blk);color:var(--yel);border:none}
.hfbtn.pdf:hover{background:#333}
.hfbtn.csv{background:transparent;color:var(--gray);border:1.5px solid var(--bdr)}
.hfbtn.csv:hover{background:var(--bg)}
.hfbtn.newst{background:transparent;color:var(--red);border:1.5px solid #F09595}
.hfbtn.newst:hover{background:var(--red-lt)}
/* Calculator */
.calc-overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.calc-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.calc-panel{position:relative;background:var(--blk);border-radius:20px 20px 0 0;width:100%;max-width:380px;padding:16px;animation:slideUp .22s ease}
.calc-display{background:#1e1e1c;border-radius:12px;padding:16px 18px;margin-bottom:14px;text-align:right}
.calc-expr{font-size:13px;color:#666;min-height:18px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calc-result{font-size:36px;font-weight:300;color:var(--white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cbtn{padding:18px 8px;font-size:20px;font-weight:500;border:none;border-radius:12px;cursor:pointer;font-family:inherit}
.cbtn:active{opacity:.7}
.cbtn.num{background:#2a2a28;color:var(--white)}
.cbtn.op{background:#3a3a38;color:var(--yel)}
.cbtn.ac{background:#555;color:var(--white);font-size:16px}
.cbtn.eq{background:var(--yel);color:var(--blk)}
.cbtn.zero{grid-column:span 2}
.calc-close{width:100%;padding:13px;background:#1e1e1c;color:#888;border:none;border-radius:12px;font-size:14px;cursor:pointer;font-family:inherit;margin-top:10px}
/* Location picker */
.scan-overlay{position:fixed;inset:0;z-index:70;background:#111;display:flex;flex-direction:column;max-height:100vh}
.scan-hdr{background:#1a1a18;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid #333}
.scan-title{color:var(--yel);font-size:16px;font-weight:600}
.scan-close-btn{background:none;border:1px solid #444;border-radius:8px;color:#aaa;font-size:14px;cursor:pointer;padding:7px 14px;font-family:inherit}
.scan-body{flex:1;overflow-y:auto;padding:16px}
.scan-type-row{display:flex;gap:8px;margin-bottom:14px}
.scan-type-btn{flex:1;padding:12px;font-size:15px;font-weight:600;border-radius:10px;border:2px solid #333;background:#1e1e1c;color:#666;cursor:pointer;font-family:inherit}
.scan-type-btn.active{border-color:var(--yel);color:var(--yel);background:#2a2800}
.scan-bay-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.scan-bay-btn{padding:12px 4px;font-size:14px;font-weight:600;border-radius:8px;border:1.5px solid #333;background:#1e1e1c;color:#888;cursor:pointer;font-family:inherit;text-align:center}
.scan-bay-btn:hover,.scan-bay-btn.sel{border-color:var(--yel);color:var(--yel);background:#2a2800}
.scan-divider{display:flex;align-items:center;gap:10px;margin:12px 0}
.scan-divider-line{flex:1;height:1px;background:#333}
.scan-divider-txt{font-size:11px;color:#555}
.scan-cam-btn{width:100%;padding:13px;background:#1e1e1c;border:1.5px solid #333;border-radius:10px;color:#888;font-size:14px;cursor:pointer;font-family:inherit;margin-bottom:10px}
.scan-cam-btn:hover{border-color:#555;color:#aaa}
.scan-viewport{height:220px;position:relative;overflow:hidden;border-radius:12px;margin-bottom:10px;display:none}
.scan-viewport.active{display:block}
#scan-video{width:100%;height:100%;object-fit:cover}
.scan-target{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:160px;height:160px;border:2px solid var(--yel);border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.5)}
.scan-status{font-size:12px;color:#666;text-align:center;margin-bottom:12px;min-height:16px}
.scan-confirm-btn{width:100%;padding:15px;background:var(--yel);color:var(--blk);border:none;border-radius:11px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:4px}
.scan-confirm-btn:disabled{opacity:.3;cursor:default}
/* Find Stock */
.find-overlay{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;flex-direction:column;justify-content:flex-end}
.find-backdrop{position:absolute;inset:0}
.find-panel{position:relative;background:var(--white);border-radius:18px 18px 0 0;max-height:90vh;display:flex;flex-direction:column;animation:slideUp .24s ease}
.find-hdr{background:var(--blk);border-radius:18px 18px 0 0;padding:16px 20px 14px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.find-hdr-title{font-size:17px;font-weight:700;color:var(--yel)}
.find-close{background:none;border:none;font-size:24px;color:#666;cursor:pointer;line-height:1}
.find-close:hover{color:var(--white)}
.find-search-wrap{padding:14px 16px 10px;flex-shrink:0;border-bottom:1px solid var(--bdr)}
.find-inp{width:100%;padding:13px 16px;font-size:16px;border:1.5px solid var(--bdr);border-radius:11px;background:var(--bg);color:var(--blk);font-family:inherit}
.find-inp:focus{outline:none;border-color:var(--blk)}
.find-loading{text-align:center;padding:32px;color:#bbb;font-size:14px}
.find-results{overflow-y:auto;flex:1}
.find-result{padding:14px 18px;border-bottom:1px solid #f5f5f3;display:flex;align-items:center;gap:12px}
.find-result:last-child{border-bottom:none}
.find-result-info{flex:1;min-width:0}
.find-result-name{font-size:15px;font-weight:500}
.find-result-sku{font-size:12px;color:var(--gray);margin-top:2px}
.find-loc{font-size:13px;font-weight:600;background:var(--yel-lt);border:1px solid var(--yel-dk);color:#7a6000;padding:4px 12px;border-radius:20px;white-space:nowrap}
.find-loc.none{background:#f5f5f3;border-color:var(--bdr);color:#bbb;font-weight:400}
.find-empty{text-align:center;padding:40px 20px;color:#bbb;font-size:14px}
/* Home button in header */
.hdr-btn.home{border-color:#FFD100;color:#FFD100}
.hdr-btn.home:hover{background:#2a2800;border-color:#FFD100}
/* Submitted banner */
.submitted-banner{background:#1a3a0a;border-bottom:2px solid #4CAF50;padding:10px 16px;display:flex;align-items:center;gap:10px}
.submitted-banner-icon{font-size:18px}
.submitted-banner-text{flex:1}
.submitted-banner-title{font-size:13px;font-weight:600;color:#4CAF50}
.submitted-banner-sub{font-size:11px;color:#6a9a5a;margin-top:1px}
.submitted-banner-undo{background:none;border:1px solid #4CAF50;border-radius:6px;color:#4CAF50;font-size:11px;cursor:pointer;padding:4px 10px;font-family:inherit}
/* In-progress banner */
.inprogress-banner{background:#2a2800;border-bottom:2px solid var(--yel);padding:8px 16px;display:flex;align-items:center;gap:8px}
.inprogress-banner span{font-size:12px;color:var(--yel)}
/* View Previous Counts button on count screen */
.view-prev-btn{width:100%;padding:14px 16px;background:transparent;border:1.5px solid var(--bdr);border-radius:11px;color:var(--blk);font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.view-prev-btn:hover{background:var(--bg);border-color:#bbb}
.view-prev-btn .vpb-left{display:flex;align-items:center;gap:8px}
.view-prev-btn .vpb-count{background:var(--blk);color:var(--yel);border-radius:10px;padding:2px 9px;font-size:12px;font-weight:600}
.view-prev-btn .vpb-arrow{color:#bbb;font-size:18px}
/* Bottom action bar */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1.5px solid var(--bdr);padding:12px 16px;z-index:9;max-width:480px;margin:0 auto}
.bottom-bar-inner{display:flex;gap:10px}
.btn-submit{flex:1;padding:15px;font-size:15px;font-weight:700;border:none;border-radius:11px;background:var(--blk);color:var(--yel);cursor:pointer;font-family:inherit;letter-spacing:.01em}
.btn-submit:disabled{opacity:.3;cursor:default}
.btn-submit:not(:disabled):hover{background:#222}
.btn-submit.done{background:#1a3a0a;color:#4CAF50;border:1.5px solid #4CAF50}
/* Spacer so bottom-bar doesn't cover content */
.bottom-bar-spacer{height:80px}
/* Submit confirmation modal */
.submit-modal-overlay{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center}
.submit-modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.submit-modal{position:relative;background:var(--white);border-radius:20px 20px 0 0;padding:24px 20px 32px;width:100%;max-width:480px;animation:slideUp .22s ease}
.submit-modal-icon{font-size:40px;text-align:center;margin-bottom:12px}
.submit-modal-title{font-size:20px;font-weight:700;text-align:center;margin-bottom:6px}
.submit-modal-sub{font-size:14px;color:var(--gray);text-align:center;margin-bottom:20px;line-height:1.5}
.submit-modal-stats{display:flex;gap:10px;margin-bottom:24px}
.submit-stat{flex:1;background:var(--bg);border-radius:10px;padding:12px;text-align:center}
.submit-stat-n{font-size:22px;font-weight:700;color:var(--blk)}
.submit-stat-l{font-size:11px;color:var(--gray);margin-top:2px}
.submit-modal-btns{display:flex;flex-direction:column;gap:8px}
.btn-submit-confirm{width:100%;padding:16px;font-size:16px;font-weight:700;border:none;border-radius:11px;background:var(--yel);color:var(--blk);cursor:pointer;font-family:inherit}
.btn-submit-confirm:hover{background:var(--yel-dk)}
.btn-submit-cancel{width:100%;padding:13px;font-size:14px;font-weight:500;border:1.5px solid var(--bdr);border-radius:11px;background:transparent;color:var(--gray);cursor:pointer;font-family:inherit}
/* Success screen */
.success-screen{max-width:480px;margin:0 auto;padding:48px 24px;text-align:center}
.success-icon{font-size:64px;margin-bottom:20px}
.success-title{font-size:24px;font-weight:700;margin-bottom:8px}
.success-sub{font-size:15px;color:var(--gray);margin-bottom:8px}
.success-meta{font-size:13px;color:#bbb;margin-bottom:32px}
.success-actions{display:flex;flex-direction:column;gap:10px}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.modal{position:relative;background:var(--white);border-radius:14px;padding:24px 20px;width:100%;max-width:320px}
.modal-title{font-size:16px;font-weight:600;margin-bottom:4px}
.modal-sub{font-size:13px;color:var(--gray);margin-bottom:20px}
.modal-inp{width:100%;padding:12px 14px;font-size:20px;font-weight:500;text-align:center;border:1.5px solid var(--bdr);border-radius:9px;font-family:inherit;background:var(--bg);color:var(--blk);margin-bottom:16px}
.modal-inp:focus{outline:none;border-color:var(--blk)}
.modal-row{display:flex;gap:10px}
.modal-btn{flex:1;padding:12px;font-size:14px;font-weight:500;border-radius:9px;cursor:pointer;font-family:inherit}
.modal-btn.save{background:var(--blk);color:var(--yel);border:none}
.modal-btn.cancel{background:transparent;color:var(--gray);border:1.5px solid var(--bdr)}
/* Toast */

async function fbSet(path, data) {
  try {
    const r = await fetch(`${FB}/${path}.json`, {
      method: 'PUT',
      body: JSON.stringify(data),
      headers: { 'Content-Type': 'application/json' }
    });
    return r.ok;
  } catch(e) { return false; }
}
async function fbDelete(path) {
  try {
    const r = await fetch(`${FB}/${path}.json`, { method: 'DELETE' });
    return r.ok;
  } catch(e) { return false; }
}
async function fbGet(path) {
  try {
    const r = await fetch(`${FB}/${path}.json`);
    return r.ok ? await r.json() : null;
  } catch(e) { return null; }
}

function saveLocal(){
  // Keep a minimal local backup of in-progress session only (not the submitted stocktake)
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({
    counter:S.counter,branch:S.branch,date:S.date,
    history:S.history,nextId:S.nextId,submitted:S.submitted
  }));}catch(e){}
}
function loadLocalInProgress(){
  // Only used to restore an in-progress session on the same device
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return false;
    const d=JSON.parse(raw);
    if(d.submitted)return false; // submitted sessions come from Firebase only
    if(!d.counter||!d.history||d.history.length===0)return false;
    S.counter=d.counter||'';S.branch=d.branch||'Arndell Park';
    S.date=d.date||S.date;S.history=d.history||[];
    S.nextId=d.nextId||1;S.location='';S.submitted=false;
    S.screen='count';
    return true;
  }catch(e){return false;}
}

// Load previous SUBMITTED stocktake from Firebase
async function loadPreviousFromFirebase(){
  const msgEl=document.getElementById('no-prev-msg');
  const btn=document.getElementById('btn-load');
  if(btn){btn.textContent='Loading...';btn.disabled=true;}
  try{
    const data=await fbGet('stocktake/current');
    if(!data||!data.meta||!data.meta.submitted){
      if(msgEl)msgEl.style.display='block';
      if(msgEl)msgEl.textContent='No previous submitted stocktake found in Firebase';
      if(btn){btn.textContent='📋 Previous Stocktake';btn.disabled=false;}
      return;
    }
    const meta=data.meta;
    const items=data.items?Object.values(data.items):[];
    S.counter=meta.counter||'';
    S.branch=meta.branch||'Arndell Park';
    S.date=meta.date||S.date;
    S.history=items;
    S.nextId=items.length+1;
    S.location='';
    S.submitted=true;
    S.screen='count';
    render();
    toast(`Previous stocktake loaded — ${meta.date} by ${meta.counter}`);
  }catch(e){
    if(msgEl){msgEl.style.display='block';msgEl.textContent='Error loading from Firebase — check connection';}
    if(btn){btn.textContent='📋 Previous Stocktake';btn.disabled=false;}
  }
}

// ── Firebase sync ─────────────────────────────────────────────────────────────
function setSyncStatus(status){
  S.syncStatus=status;
  const dot=document.querySelector('.sync-dot');
  const txt=document.querySelector('.sync-txt');
  if(dot){dot.className='sync-dot '+status;}
  if(txt){
    txt.textContent=status==='ok'?'Synced to Firebase':status==='syncing'?'Syncing...':status==='err'?'Offline — saved locally':'Ready';
  }
}

async function pushItemToFirebase(item){
  setSyncStatus('syncing');
  const ok=await fbSet(`stocktake/current/items/${item.fbId}`,item);
  setSyncStatus(ok?'ok':'err');
  return ok;
}

async function deleteItemFromFirebase(fbId){
  await fbDelete(`stocktake/current/items/${fbId}`);
}

async function updateItemInFirebase(fbId, count){
  setSyncStatus('syncing');
  const ok=await fbSet(`stocktake/current/items/${fbId}/count`, count);
  setSyncStatus(ok?'ok':'err');
}

// For Find Stock — read from stocktake/current, sort F > M > T
async function getLatestLocations(){
  const data=await fbGet('stocktake/current');
  if(!data)return{};
  const meta=data.meta||{};
  const items=data.items||{};
  if(typeof items!=='object')return{};
  const latest={};
  Object.values(items).forEach(item=>{
    if(!item||!item.sku||!item.location)return;
    if(!latest[item.sku]) latest[item.sku]=[];
    latest[item.sku].push({
      location:item.location,count:item.count,
      date:meta.date||item.date,
      counter:meta.counter||item.counter,
      submitted:meta.submitted||false,
      timestamp:item.timestamp||0
    });
  });
  const locOrder=['F','M','T'];
  const result={};
  Object.entries(latest).forEach(([sku,entries])=>{
    entries.sort((a,b)=>{
      const ai=locOrder.indexOf(a.location[0]);
      const bi=locOrder.indexOf(b.location[0]);
      if(ai!==bi)return ai-bi;
      return a.location.localeCompare(b.location);
    });
    result[sku]=entries[0];
  });
  return result;
}

function tallyFor(sku){
  const p=sku&&sku!=='__custom__'?findP(sku):null;
  const u=S.count;
  return{boxes:p&&p.bq?Math.floor(u/p.bq):0,pals:p&&p.pq?(u/p.pq).toFixed(2):0,units:u};
}

async function lookupFindSku(sku){
  const panel=document.getElementById('find-result-panel');
  if(!panel)return;
  if(!sku){
    panel.innerHTML='<div style="text-align:center;color:#bbb;font-size:14px;padding:24px 0">Select a product above to see its location</div>';
    return;
  }
  panel.innerHTML='<div style="text-align:center;color:#bbb;font-size:14px;padding:24px 0">Looking up...</div>';
  try{
    const data=await fbGet('stocktake/current');
    if(!data||!data.items){
      panel.innerHTML='<div style="text-align:center;color:#bbb;font-size:14px;padding:24px 0">No submitted stocktake found.<br>Submit a stocktake first.</div>';
      return;
    }
    const meta=data.meta||{};
    const items=Object.values(data.items);
    const matches=items.filter(item=>item&&item.sku===sku);
    const p=findP(sku);
    if(!matches.length){
      panel.innerHTML=`
        <div style="margin-bottom:12px">
          <div style="font-size:16px;font-weight:600;color:var(--blk)">${x(p?p.desc:sku)}</div>
          <div style="font-size:12px;color:var(--gray);margin-top:2px">${x(sku)}</div>
        </div>
        <div style="padding:16px;background:var(--bg);border-radius:12px;text-align:center;color:#bbb;font-size:14px">Not counted in last stocktake</div>
        <div style="font-size:12px;color:#aaa;margin-top:8px">Stocktake: ${x(meta.date||'Unknown')} · ${x(meta.counter||'Unknown')}</div>`;
      return;
    }
    const locOrder=['F','M','T'];
    matches.sort((a,b)=>{
      const al=a.location||'';const bl2=b.location||'';
      const ai=locOrder.indexOf(al[0]);const bi=locOrder.indexOf(bl2[0]);
      if(ai!==bi)return(ai===-1?99:ai)-(bi===-1?99:bi);
      return al.localeCompare(bl2);
    });
    const best=matches[0];
    const loc=best.location||null;
    const totalUnits=matches.reduce((a,m)=>a+Number(m.count||0),0);
    const allLocs=[...new Set(matches.map(m=>m.location).filter(Boolean))];
    panel.innerHTML=`
      <div style="margin-bottom:14px">
        <div style="font-size:16px;font-weight:600;color:var(--blk)">${x(p?p.desc:sku)}</div>
        <div style="font-size:12px;color:var(--gray);margin-top:2px">${x(sku)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;padding:16px;background:var(--bg);border-radius:12px;margin-bottom:10px">
        <div style="font-size:13px;color:var(--gray);flex:1">Best location</div>
        <span class="find-loc${!loc?' none':''}" style="font-size:20px;padding:8px 18px">${loc||'Floor stock'}</span>
      </div>
      ${allLocs.length>1?`<div style="font-size:12px;color:var(--gray);margin-bottom:8px">Also found at: ${allLocs.slice(1).map(l=>`<span style="background:var(--yel-lt);padding:2px 8px;border-radius:6px;margin-right:4px;font-weight:500">${x(l)}</span>`).join('')}</div>`:''}
      <div style="font-size:13px;color:var(--blk);margin-bottom:4px">Total counted: <strong>${totalUnits.toLocaleString()} units</strong></div>
      <div style="font-size:12px;color:#aaa">Stocktake: ${x(meta.date||'Unknown')} · ${x(meta.counter||'Unknown')} · ${meta.submitted?'✅ Submitted':'⚠ In progress'}</div>
    `;
  }catch(e){
    panel.innerHTML='<div style="text-align:center;color:#D85A30;font-size:14px;padding:24px 0">Error loading from Firebase.<br>Check your connection.</div>';
  }
}

function exportPDF(){
  const totals={};
  S.history.forEach(h=>{
    if(!totals[h.sku])totals[h.sku]={sku:h.sku,desc:h.desc,count:0,locations:[]};
    totals[h.sku].count+=h.count;
    if(h.location&&!totals[h.sku].locations.includes(h.location))totals[h.sku].locations.push(h.location);
  });
  const PW=595,PH=842,ML=36,MR=36,MT=40;
  const USABLE=PW-ML-MR;
  const ROW_H=13,GROUP_H=15,HDR_H=17;
  const cols=[{x:ML,w:55},{x:ML+57,w:155},{x:ML+214,w:45},{x:ML+261,w:45},{x:ML+308,w:38},{x:ML+348,w:45},{x:ML+395,w:USABLE-359}];
  let objs=[];
  function o(c){objs.push(c);return objs.length;}
  function ep(s){return String(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)').replace(/[^\x20-\x7E]/g,'?');}
  function txt(s,fx,fy,sz,bold){return`BT /${bold?'Fb':'Fr'} ${sz} Tf ${fx} ${fy} Td (${ep(String(s))}) Tj ET\n`;}
  function hline(x1,y1,x2,y2){return`0.5 w ${x1} ${y1} m ${x2} ${y2} l S\n`;}
  const pages=[];
  function np(){return{s:[],y:PH-MT-24};}
  let pg=np();
  function es(n){if(pg.y-n<55){pages.push(pg);pg=np();}}
  pg.s.push(`0.067 0.067 0.067 rg ${ML-4} ${PH-MT-28} ${USABLE+8} 36 re f\n`);
  pg.s.push(`1 0.816 0 rg\n`);
  pg.s.push(txt('MED-X HEALTHCARE SOLUTIONS — STOCKTAKE WORKSHEET',ML,PH-MT-8,11,true));
  pg.s.push(`0.5 0.5 0.5 rg\n`);
  pg.s.push(txt(`Site: ${S.branch}   |   Date: ${S.date}   |   Counter: ${S.counter}   |   ${new Date().toLocaleString('en-AU')}`,ML,PH-MT-20,8,false));
  pg.s.push(`0 0 0 rg\n`);pg.y=PH-MT-38;
  es(HDR_H);
  pg.s.push(`0.067 0.067 0.067 rg ${ML-2} ${pg.y-HDR_H+4} ${USABLE+4} ${HDR_H} re f\n`);
  pg.s.push(`1 0.816 0 rg\n`);
  ['SKU','Description','Units','Cartons','Loose','~Pallets','Locations'].forEach((h,i)=>pg.s.push(txt(h,cols[i].x+2,pg.y-HDR_H+6,7.5,true)));
  pg.s.push(`0 0 0 rg\n`);pg.y-=HDR_H;
  let alt=false;let grand=0;
  CATS.forEach(c=>{
    es(GROUP_H);
    pg.s.push(`0.95 0.92 0.2 rg ${ML-2} ${pg.y-GROUP_H+4} ${USABLE+4} ${GROUP_H} re f\n`);
    pg.s.push(`0.067 0.067 0.067 rg\n`);
    pg.s.push(txt(c.g.toUpperCase(),ML+2,pg.y-GROUP_H+6,7.5,true));
    pg.s.push(`0 0 0 rg\n`);pg.y-=GROUP_H;alt=false;
    c.items.forEach(item=>{
      es(ROW_H);
      const pt=totals[item.sku];const cnt=pt?pt.count:0;
      const p=findP(item.sku);
      const ctns=p&&p.bq&&cnt?Math.floor(cnt/p.bq):'';
      const loose=p&&p.bq&&cnt?cnt%p.bq:'';
      const pals=p&&p.pq&&cnt?(cnt/p.pq).toFixed(1):'';
      const locs=pt&&pt.locations.length?pt.locations.join(', '):'';
      grand+=cnt;
      if(alt)pg.s.push(`0.97 0.97 0.95 rg ${ML-2} ${pg.y-ROW_H+4} ${USABLE+4} ${ROW_H} re f\n`);
      if(!cnt)pg.s.push(`0.72 0.72 0.72 rg\n`);else pg.s.push(`0 0 0 rg\n`);
      [item.sku,item.desc,cnt||'',ctns,loose,pals,locs].forEach((v,i)=>pg.s.push(txt(v,cols[i].x+2,pg.y-ROW_H+4,7.5,cnt>0&&i===2)));
      pg.s.push(`0 0 0 rg\n`);
      pg.s.push(hline(ML-2,pg.y-ROW_H+4,PW-MR+2,pg.y-ROW_H+4));
      pg.y-=ROW_H;alt=!alt;
    });
  });
  const customs=Object.values(totals).filter(t=>!findP(t.sku));
  if(customs.length){
    es(GROUP_H);
    pg.s.push(`0.95 0.92 0.2 rg ${ML-2} ${pg.y-GROUP_H+4} ${USABLE+4} ${GROUP_H} re f\n`);
    pg.s.push(`0.067 0.067 0.067 rg\n`);
    pg.s.push(txt('CUSTOM ITEMS',ML+2,pg.y-GROUP_H+6,7.5,true));
    pg.s.push(`0 0 0 rg\n`);pg.y-=GROUP_H;
    customs.forEach(c=>{
      es(ROW_H);grand+=c.count;
      pg.s.push(txt(c.sku,cols[0].x+2,pg.y-ROW_H+4,7.5,true));
      pg.s.push(txt(c.desc,cols[1].x+2,pg.y-ROW_H+4,7.5,false));
      pg.s.push(txt(c.count,cols[2].x+2,pg.y-ROW_H+4,7.5,true));
      pg.s.push(hline(ML-2,pg.y-ROW_H+4,PW-MR+2,pg.y-ROW_H+4));pg.y-=ROW_H;
    });
  }
  es(ROW_H+4);
  pg.s.push(`0.067 0.067 0.067 rg ${ML-2} ${pg.y-ROW_H+4} ${USABLE+4} ${ROW_H+2} re f\n`);
  pg.s.push(`1 0.816 0 rg\n`);
  pg.s.push(txt('TOTAL UNITS COUNTED',ML+2,pg.y-ROW_H+5,8.5,true));
  pg.s.push(txt(grand.toLocaleString(),cols[2].x+2,pg.y-ROW_H+5,8.5,true));
  pg.s.push(`0 0 0 rg\n`);pg.y-=ROW_H+8;
  if(pg.y>90){
    pg.s.push(hline(ML,pg.y-16,ML+140,pg.y-16));
    pg.s.push(hline(ML+160,pg.y-16,ML+300,pg.y-16));
    pg.s.push(txt(`Counter: ${S.counter}`,ML,pg.y-26,8,false));
    pg.s.push(txt('Signature: ________________________  Date: ___________',ML,pg.y-36,8,false));
    pg.s.push(txt('Verified by:',ML+160,pg.y-26,8,false));
    pg.s.push(txt('Signature: ________________________  Date: ___________',ML+160,pg.y-36,8,false));
  }
  pages.push(pg);
  const frId=o(`<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>`);
  const fbId2=o(`<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>`);
  const resId=o(`<< /Font << /Fr ${frId} 0 R /Fb ${fbId2} 0 R >> >>`);
  const pageIds=pages.map(pg=>{
    const content=pg.s.join('');
    const sid=o(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
    return o(`<< /Type /Page /Parent 0 /MediaBox [0 0 ${PW} ${PH}] /Contents ${sid} 0 R /Resources ${resId} 0 R >>`);
  });
  const pagesId=o(`<< /Type /Pages /Kids [${pageIds.map(id=>`${id} 0 R`).join(' ')}] /Count ${pageIds.length} >>`);
  pageIds.forEach(id=>{objs[id-1]=objs[id-1].replace('/Parent 0',`/Parent ${pagesId} 0 R`);});
  const catId=o(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);
  let pdf='%PDF-1.4\n';const offsets=[];
  objs.forEach((c,i)=>{offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${c}\nendobj\n`;});
  const xo=pdf.length;
  pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;
  offsets.forEach(o=>pdf+=String(o).padStart(10,'0')+' 00000 n \n');
  pdf+=`trailer\n<< /Size ${objs.length+1} /Root ${catId} 0 R >>\nstartxref\n${xo}\n%%EOF`;
  const bytes=new Uint8Array(pdf.length);
  for(let i=0;i<pdf.length;i++)bytes[i]=pdf.charCodeAt(i)&0xff;
  dlBlob(bytes,'application/octet-stream',`stocktake_${S.branch.replace(/ /g,'_')}_${S.date}.pdf`);
}

function exportCSV(){
  const totals={};
  S.history.forEach(h=>{
    if(!totals[h.sku])totals[h.sku]={sku:h.sku,desc:h.desc,count:0,locations:[]};
    totals[h.sku].count+=h.count;
    if(h.location&&!totals[h.sku].locations.includes(h.location))totals[h.sku].locations.push(h.location);
  });
  const hdr='Date,Branch,Counter,SKU,Description,Units,Cartons,Loose,Est Pallets,Locations';
  const rows=[];
  CATS.forEach(c=>c.items.forEach(item=>{
    const t=totals[item.sku];const cnt=t?t.count:0;
    const p=findP(item.sku);
    rows.push(`${S.date},${S.branch},${S.counter},${item.sku},"${item.desc}",${cnt||''},${p&&p.bq&&cnt?Math.floor(cnt/p.bq):''},${p&&p.bq&&cnt?cnt%p.bq:''},${p&&p.pq&&cnt?(cnt/p.pq).toFixed(2):''},"${t&&t.locations.length?t.locations.join(' '):''}"`)
  }));
  Object.values(totals).filter(t=>!findP(t.sku)).forEach(t=>{
    rows.push(`${S.date},${S.branch},${S.counter},CUSTOM,"${t.desc}",${t.count},,,,"${t.locations.join(' ')}"`)
  });
  dlBlob(hdr+'\n'+rows.join('\n'),'text/csv',`stocktake_${S.branch.replace(/ /g,'_')}_${S.date}.csv`);
}

function dlBlob(data,type,name){
  const blob=new Blob([data],{type});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},2000);
}

  const bt=document.getElementById('box-tally');const pt=document.getElementById('pal-tally');
  const bbs=document.getElementById('btn-box-sub');const bps=document.getElementById('btn-pal-sub');
  if(bt&&p&&p.bq){const b=Math.floor(t.units/p.bq);bt.textContent=`${b} box${b!==1?'es':''} · ${t.units.toLocaleString()} units`;}
  if(pt&&p&&p.pq){pt.textContent=`${(t.units/p.pq).toFixed(2)} pallets · ${t.units.toLocaleString()} units`;}
  if(bbs&&p&&p.bq)bbs.disabled=S.count<p.bq;
  if(bps&&p&&p.pq)bps.disabled=S.count<p.pq;
}

function calcPress(val){
  const opMap={'÷':'/','×':'*','−':'-'};
  if(val==='AC'){S.calcExpr='';S.calcDisplay='0';}
  else if(val==='C'){S.calcDisplay=S.calcDisplay.length>1?S.calcDisplay.slice(0,-1):'0';}
  else if(val==='='){
    try{let e=(S.calcExpr+S.calcDisplay).replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-');
      let r=Function('"use strict";return('+e+')')();
      S.calcDisplay=String(Math.round(r*1000000)/1000000);S.calcExpr='';}
    catch{S.calcDisplay='Error';S.calcExpr='';}
  }else if(val==='%'){try{S.calcDisplay=String(parseFloat(S.calcDisplay)/100);}catch{}}
  else if(opMap[val]||['+','-','*','/'].includes(val)){
    S.calcExpr=S.calcExpr+S.calcDisplay+(opMap[val]||val);S.calcDisplay='0';
  }else{
    if(val==='.'&&S.calcDisplay.includes('.'))return;
    S.calcDisplay=S.calcDisplay==='0'?val:S.calcDisplay+val;
  }
  const ex=document.getElementById('calc-expr');const re=document.getElementById('calc-result');
  if(ex)ex.textContent=S.calcExpr;if(re)re.textContent=S.calcDisplay;
}

async function confirmItem(){
  const p=S.sku&&S.sku!=='__custom__'?findP(S.sku):null;
  const desc=S.sku==='__custom__'?S.customDesc:(p?`${S.sku} — ${p.desc}`:S.sku);
  const card=document.getElementById('count-card');
  if(card){
    card.classList.add('slide-out');
    setTimeout(async()=>{
      const fbId=`${Date.now()}_${S.nextId}`;
      const item={id:S.nextId,fbId,sku:S.sku,desc,count:S.count,location:S.location,
        counter:S.counter,date:S.date,timestamp:Date.now(),synced:false};
      S.history.push(item);
      const saved=S.count;const savedDesc=desc;const savedLoc=S.location;
      S.sku='';S.count=0;S.customDesc='';S.location='';S.nextId++;
      saveLocal();render();
      toast(`✓ ${savedDesc} — ${saved.toLocaleString()} units${savedLoc?' @ '+savedLoc:''}`);
      // Push to Firebase async
      const ok=await pushItemToFirebase(item);
      if(ok){item.synced=true;saveLocal();}
      // Invalidate find cache so next search refreshes
      fbLocations={};
    },260);
  }
}

// ── Scanner ───────────────────────────────────────────────────────────────────
let scanStream=null;let scanInterval=null;
async function openCamera(){
  const statusEl=document.getElementById('scan-status');
  const viewport=document.getElementById('scan-viewport');
  const camBtn=document.getElementById('scan-cam-btn');
  if(statusEl)statusEl.textContent='Requesting camera...';
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const video=document.getElementById('scan-video');if(!video){stopScan();return;}
    video.srcObject=scanStream;await video.play();
    if(viewport)viewport.classList.add('active');
    if(camBtn)camBtn.style.display='none';
    if(statusEl)statusEl.textContent='Point camera at a bay QR code';
    if('BarcodeDetector' in window){
      const detector=new BarcodeDetector({formats:['qr_code']});
      scanInterval=setInterval(async()=>{
        if(!document.getElementById('scan-video')){clearInterval(scanInterval);return;}
        try{const codes=await detector.detect(video);
          if(codes.length){const val=codes[0].rawValue.trim().toUpperCase();
            if(/^[FMT]\d{2}$/.test(val)){stopScan();setLocation(val);}}}catch(e){}
      },400);
    }else{if(statusEl)statusEl.textContent='QR detect not supported — use tap buttons';}
  }catch(e){
    if(statusEl)statusEl.textContent='Camera blocked — use tap buttons above';
    if(viewport)viewport.classList.remove('active');
    if(camBtn)camBtn.style.display='block';
  }
}
function stopScan(){
  clearInterval(scanInterval);
  if(scanStream)scanStream.getTracks().forEach(t=>t.stop());
  scanStream=null;scanInterval=null;
}
function setLocation(loc){
  S.location=loc;S.showScan=false;render();
  toast(loc?`Location set: ${loc}`:'No location — floor stock');
}

// ── Firebase connection test ──────────────────────────────────────────────────
async function testFirebaseConnection(){
  try{
    const r=await fetch(`${FB}/ping.json`,{method:'PUT',body:'"ok"',headers:{'Content-Type':'application/json'}});
    if(r.ok){await fbDelete('ping');setSyncStatus('ok');}
    else setSyncStatus('err');
  }catch(e){setSyncStatus('err');}
}

// ── Submit stocktake ──────────────────────────────────────────────────────────
async function submitStocktake(){
  S.submitted=true;S.showSubmit=false;
  setSyncStatus('syncing');
  // Write metadata separately so we don't overwrite items
  const ok1=await fbSet('stocktake/current/meta',{
    submitted:true,
    date:S.date,
    counter:S.counter,
    branch:S.branch,
    timestamp:Date.now(),
    itemCount:S.history.length
  });
  // Also write all items in one batch to ensure nothing is missing
  const itemsObj={};
  S.history.forEach(item=>{ itemsObj[item.fbId||`item_${item.id}`]=item; });
  const ok2=await fbSet('stocktake/current/items',itemsObj);
  setSyncStatus(ok1&&ok2?'ok':'err');
  saveLocal();
  fbLocations={};
  S.screen='success';
  render();
  toast(ok1&&ok2?'✅ Stocktake submitted & saved to Firebase':'✅ Submitted — Firebase sync failed, check connection');
}

// ── Bind ──────────────────────────────────────────────────────────────────────
function bind(){
  const q=id=>document.getElementById(id);

  // Success screen
  if(S.screen==='success'){
    const spdf=q('btn-success-pdf');if(spdf)spdf.addEventListener('click',exportPDF);
    const scsv=q('btn-success-csv');if(scsv)scsv.addEventListener('click',exportCSV);
    const svw=q('btn-success-view');if(svw)svw.addEventListener('click',()=>{S.screen='count';S.showHistory=true;render();});
    const shm=q('btn-success-home');if(shm)shm.addEventListener('click',()=>{S.screen='setup';render();});
    return;
  }

  if(S.screen==='setup'){
    const fn=q('f-name');if(fn)fn.addEventListener('input',e=>{S.counter=e.target.value;const b=q('btn-start');if(b)b.disabled=!S.counter.trim();});
    const fb=q('f-branch');if(fb)fb.addEventListener('input',e=>{S.branch=e.target.value;});
    const fd=q('f-date');if(fd)fd.addEventListener('change',e=>{S.date=e.target.value;});
    const bs=q('btn-start');if(bs)bs.addEventListener('click',()=>{if(S.counter.trim()){S.screen='count';render();}});
    const bl=document.getElementById('btn-load');
    if(bl)bl.addEventListener('click',()=>loadPreviousFromFirebase());
    const bfh=document.getElementById('btn-find-home');if(bfh)bfh.addEventListener('click',()=>{S.showFind=true;fbLocations={};render();});
    return;
  }
  const bfc=document.getElementById('btn-find-count');if(bfc)bfc.addEventListener('click',()=>{S.showFind=true;fbLocations={};render();});
  const bc=q('btn-calc');if(bc)bc.addEventListener('click',()=>{S.showCalc=true;render();});
  const bh=q('btn-hist');if(bh)bh.addEventListener('click',()=>{S.showHistory=true;render();});
  const bsc=q('btn-scan');if(bsc)bsc.addEventListener('click',()=>{
    S._scanType='';S._scanBay='';S.showScan=true;render();
  });

  // Home button — safe nav back to setup
  const bhome=q('btn-home');if(bhome)bhome.addEventListener('click',()=>{
    if(S.history.length>0&&!S.submitted){
      if(!confirm('Go back to home? Your counts are saved and you can continue later.'))return;
    }
    S.screen='setup';render();
  });

  // View Previous Counts
  const bvp=q('btn-view-prev');if(bvp)bvp.addEventListener('click',()=>{S.showHistory=true;render();});

  // Submit button
  const bsub=q('btn-submit');if(bsub)bsub.addEventListener('click',()=>{
    if(S.submitted){S.showHistory=true;render();return;}
    if(!S.history.length)return;
    S.showSubmit=true;render();
  });

  // Undo submit
  const bundo=q('btn-undo-submit');if(bundo)bundo.addEventListener('click',()=>{
    if(confirm('Reopen this stocktake for editing?')){S.submitted=false;saveLocal();render();}
  });

  // Submit modal
  const bsconf=q('btn-submit-confirm');if(bsconf)bsconf.addEventListener('click',submitStocktake);
  const bscanc=q('btn-submit-cancel');if(bscanc)bscanc.addEventListener('click',()=>{S.showSubmit=false;render();});
  const smbd=q('submit-modal-backdrop');if(smbd)smbd.addEventListener('click',()=>{S.showSubmit=false;render();});
  const sel=q('item-sel');if(sel)sel.addEventListener('change',e=>{S.sku=e.target.value;S.count=0;render();});
  const ci=q('custom-inp');if(ci)ci.addEventListener('input',e=>{S.customDesc=e.target.value;updateConfirm();});
  const bba=q('btn-box-add');if(bba)bba.addEventListener('click',()=>{const p=findP(S.sku);if(p&&p.bq){S.count+=p.bq;syncCount();updateConfirm();updateTally();}});
  const bbs=q('btn-box-sub');if(bbs)bbs.addEventListener('click',()=>{const p=findP(S.sku);if(p&&p.bq&&S.count>=p.bq){S.count-=p.bq;syncCount();updateConfirm();updateTally();}});
  const bpa=q('btn-pal-add');if(bpa)bpa.addEventListener('click',()=>{const p=findP(S.sku);if(p&&p.pq){S.count+=p.pq;syncCount();updateConfirm();updateTally();}});
  const bps=q('btn-pal-sub');if(bps)bps.addEventListener('click',()=>{const p=findP(S.sku);if(p&&p.pq&&S.count>=p.pq){S.count-=p.pq;syncCount();updateConfirm();updateTally();}});
  const bm=q('btn-minus');if(bm)bm.addEventListener('click',()=>{if(S.count>0){S.count--;syncCount();updateConfirm();updateTally();}});
  const bpl=q('btn-plus');if(bpl)bpl.addEventListener('click',()=>{S.count++;syncCount();updateConfirm();updateTally();});
  const cn=q('count-num');if(cn)cn.addEventListener('input',e=>{S.count=Math.max(0,parseInt(e.target.value)||0);updateConfirm();updateTally();});
  const bcl=q('btn-clr');if(bcl)bcl.addEventListener('click',()=>{S.count=0;syncCount();updateConfirm();updateTally();});
  const bconf=q('btn-confirm');if(bconf)bconf.addEventListener('click',confirmItem);
  const hclose=q('hist-close');if(hclose)hclose.addEventListener('click',()=>{S.showHistory=false;render();});
  const hback=q('hist-backdrop');if(hback)hback.addEventListener('click',()=>{S.showHistory=false;render();});
  document.querySelectorAll('.hist-edit').forEach(btn=>btn.addEventListener('click',e=>{const id=parseInt(e.target.dataset.id);const h=S.history.find(z=>z.id===id);if(h){S.editId=id;S.editCount=h.count;render();}}));
  document.querySelectorAll('.hist-del').forEach(btn=>btn.addEventListener('click',async e=>{
    const id=parseInt(e.target.dataset.id);
    const h=S.history.find(z=>z.id===id);
    if(h&&h.fbId)await deleteItemFromFirebase(`stocktake/${TODAY}/${h.fbId}`);
    S.history=S.history.filter(z=>z.id!==id);saveLocal();render();
  }));
  const bpdf=q('btn-pdf');if(bpdf)bpdf.addEventListener('click',exportPDF);
  const bcsv=q('btn-csv');if(bcsv)bcsv.addEventListener('click',exportCSV);
  const bnst=q('btn-newst');if(bnst)bnst.addEventListener('click',()=>{if(confirm('Reset everything and start a fresh stocktake?')){try{localStorage.removeItem(SAVE_KEY);}catch(e){}S=defaultState();render();}});
  const ccl=q('calc-close');if(ccl)ccl.addEventListener('click',()=>{S.showCalc=false;render();});
  const cbk=q('calc-backdrop');if(cbk)cbk.addEventListener('click',()=>{S.showCalc=false;render();});
  document.querySelectorAll('.cbtn').forEach(btn=>btn.addEventListener('click',e=>calcPress(e.target.dataset.val)));
  const scl=q('scan-close');if(scl)scl.addEventListener('click',()=>{stopScan();S.showScan=false;render();});
  const scam=q('scan-cam-btn');if(scam)scam.addEventListener('click',openCamera);
  const bnoloc=q('btn-no-location');if(bnoloc)bnoloc.addEventListener('click',()=>{stopScan();setLocation('');});
  document.querySelectorAll('.scan-type-btn').forEach(btn=>btn.addEventListener('click',e=>{S._scanType=e.target.dataset.type;S._scanBay='';render();}));
  document.querySelectorAll('.scan-bay-btn').forEach(btn=>btn.addEventListener('click',e=>{
    S._scanBay=e.target.dataset.bay;
    document.querySelectorAll('.scan-bay-btn').forEach(b=>b.classList.toggle('sel',b===e.target));
    const conf=q('scan-confirm');if(conf){conf.disabled=false;conf.textContent=`Set location: ${S._scanBay}`;}
  }));
  const sconf=q('scan-confirm');if(sconf)sconf.addEventListener('click',()=>{if(S._scanBay){stopScan();setLocation(S._scanBay);S._scanBay='';S._scanType='F';}});
  const fc=document.getElementById('find-close');if(fc)fc.addEventListener('click',()=>{S.showFind=false;render();});
  const fbk=document.getElementById('find-backdrop');if(fbk)fbk.addEventListener('click',()=>{S.showFind=false;render();});
  const fsel=document.getElementById('find-sel');if(fsel)fsel.addEventListener('change',e=>lookupFindSku(e.target.value));
  const mc=q('modal-cancel');if(mc)mc.addEventListener('click',()=>{S.editId=null;render();});
  const mb=q('modal-backdrop');if(mb)mb.addEventListener('click',()=>{S.editId=null;render();});
  const mi=q('modal-inp');if(mi)mi.addEventListener('input',e=>{S.editCount=parseInt(e.target.value)||0;});
  const ms=q('modal-save');if(ms)ms.addEventListener('click',async()=>{
    const h=S.history.find(z=>z.id===S.editId);
    if(h){h.count=parseInt(S.editCount)||0;if(h.fbId)await updateItemInFirebase(h.fbId,h.count);}
    S.editId=null;saveLocal();render();
  });
}

// ── PWA service worker registration ──────────────────────────────────────────
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

// ── Init ──────────────────────────────────────────────────────────────────────
loadLocalInProgress(); // Restore in-progress session on same device only
render();
testFirebaseConnection();
</script>
